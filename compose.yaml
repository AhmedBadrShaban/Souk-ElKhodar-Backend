services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: souk_dev
      POSTGRES_USER: souk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - souk_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U souk -d souk_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  souk_postgres:
